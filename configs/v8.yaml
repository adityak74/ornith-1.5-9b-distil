# v8 -- error-conditioned data. The first run whose training set is a function
# of what THIS student gets wrong rather than of a static pool's composition.
#
#   pool -> v1 rolls out -> verify -> keep failures -> teacher answers those
#        -> verify -> sequence CE, continuing from v1's fused bf16
#
# Everything else is v1's recipe: same objective (the one known to work), same
# teachers, same verifiers, same rank/layers/lr. The ONE variable against the
# control arm (configs/v8-control.yaml) is which prompts: failures vs random,
# same count. Stage order: (v8pool prompts) -> rollout -> teach -> dataset
#                          -> train -> fuse -> quantize -> eval

seed: 17
out_dir: runs/v8

prompts:
  # Source pools. Everything here must be disjoint from the eval sets;
  # `dataset` re-checks with n-gram decontamination against MMLU test /
  # TruthfulQA / HumanEval before writing the training files.
  knowledge:
    - {hf: cais/mmlu, config: all, split: auxiliary_train, n: 1500, kind: mcq}
    - {hf: allenai/ai2_arc, config: ARC-Challenge, split: train, n: 300, kind: mcq}
    - {hf: allenai/openbookqa, config: main, split: train, n: 200, kind: mcq}
  truthfulness:
    # TruthfulQA itself is eval-only (817 items, no train split) -- never sampled.
    - {hf: mandarjoshi/trivia_qa, config: rc.nocontext, split: train, n: 600, kind: qa}
    - {hf: allenai/sciq, config: default, split: train, n: 400, kind: mcq}
  code:
    # Every MBPP split is fair game: our code eval is HumanEval, so MBPP test is
    # training data, not eval data, and all of it ships with executable tests.
    # CodeFeedback was dropped after measurement -- 24% of its traces were usable
    # against MBPP's 74%, and none of them verifiable. See DECISIONS.md 6.
    - {hf: google-research-datasets/mbpp, config: full, split: train, n: 374, kind: code}
    - {hf: google-research-datasets/mbpp, config: full, split: test, n: 500, kind: code}
    - {hf: google-research-datasets/mbpp, config: full, split: validation, n: 90, kind: code}
    - {hf: google-research-datasets/mbpp, config: full, split: prompt, n: 10, kind: code}

rollout:
  pool: runs/v8pool/prompts.jsonl
  student: /Volumes/SATECHI/.omlx/Ornith-1.5-9B-MLX-distil-oQ4   # v1 at its deployed bit width
  control_dir: runs/v8-control
  batch_size: 8
  max_tokens: {default: 2048, mcq: 3072, qa: 2048, code: 4096}   # the eval budgets

teach:
  batch_size: 16         # mlx batched generation
  think: true            # keep teacher reasoning traces in the target
  keep_think_in_target: true
  max_retries: 2

dataset:
  # Rejection sampling: only keep samples whose answer is verifiably right.
  verify_mcq: true       # teacher letter must match gold
  verify_code: true      # generated code must pass the dataset's own tests
  verify_qa: true        # normalized-substring match against gold aliases
  decontaminate_ngram: 13
  max_seq_len: 2048      # failures are hard prompts with long teacher traces;
                         # 1024 would reject most (chunkwise path makes 2048 fit)
  valid_frac: 0.02
  mix:                   # target proportions of the final training set
    knowledge: 0.40
    truthfulness: 0.25
    code: 0.35

train:
  # Full FT of a 9B in bf16 needs ~110 GB with AdamW; on a 64 GB M4 Pro we
  # train high-rank LoRA over the bf16 base instead, then fuse.
  fine_tune_type: lora
  base: runs/v1/fused      # CONTINUE from v1's fused bf16 -- fresh LoRA on top of the
                           # best checkpoint, not a restart from the stock base
  num_layers: 16          # half the stack; backprop stops there
  rank: 32
  scale: 16.0
  dropout: 0.05
  batch_size: 1           # memory scales ~20 MB/token; batch 2 does not fit
  grad_accumulation_steps: 1   # 4 kept four backward graphs alive and hit
                               # Metal's 499000 live-resource limit
  iters: 660             # ~2 epochs over the 330 verified failures the dataset
                         # stage actually kept (of 1,247); same for both arms
  learning_rate: 3.0e-5   # lowered with the effective batch (4 -> 1)
  lr_schedule: cosine_decay
  warmup: 150
  max_seq_length: 2048
  gdn_chunk: 64           # chunkwise gated-delta path; needed for 2048 to fit
  grad_checkpoint: true
  clear_cache_threshold: 8
  steps_per_eval: 200
  save_every: 200
  mask_prompt: true

quantize:
  # mlx-lm baseline quants for A/B against the oQ series.
  variants:
    - {name: q8, bits: 8, group_size: 64}
    - {name: q4, bits: 4, group_size: 64}
  # `--variant oq4|oq3|oq2` reproduces the mixed-bit map read straight out of
  # the corresponding checkpoint in models.yaml (oQ4 = 4-bit affine g64 with 120
  # modules promoted to 5/6/8 bits). oq8 is uniform 8-bit, so use --variant q8.
  # Set a command template here ({src}/{dst} substituted) to override with an
  # external quantizer instead.
  recipes:
    oq4: null
    oq3: null
    oq2: null

eval:
  benchmarks: [mmlu, truthfulqa, humaneval]
  mmlu_sample: 1000       # same 1000-item sample as the baseline table
  think: true
  # Per-benchmark budgets. At 2048 the bf16 student truncated 19/164 HumanEval
  # items mid-reasoning -- every one scored wrong, which measures the budget,
  # not the model. The runner reports the truncation count; if it is not ~0,
  # raise the budget rather than reading the score.
  max_tokens:
    default: 2048
    mmlu: 3072
    humaneval: 4096
  temp: 0.0
