# Model registry. Repo ids are HuggingFace ids; `local` overrides with a path on disk.

# Where a finished model is installed for the oMLX server to pick up.
install_dir: /Volumes/SATECHI/.omlx

student:
  base:            # full-precision student we actually train (bf16, 17 GB)
    repo: ornith-ai/Ornith-1.5-9B-MLX
    local: /Volumes/SATECHI/.omlx/ornith-ai/Ornith-1.5-9B-MLX
  quantized:       # existing oQ artifacts -- eval targets and quant references
    oq8: /Volumes/SATECHI/.omlx/Ornith-1.5-9B-MLX-oQ8
    oq4: /Volumes/SATECHI/.omlx/Ornith-1.5-9B-MLX-oQ4
    oq3: /Volumes/SATECHI/.omlx/Ornith-1.5-9B-MLX-oQ3
    oq2: /Volumes/SATECHI/.omlx/Ornith-1.5-9B-MLX-oQ2

teachers:
  knowledge:       # MMLU / TruthfulQA-style: strongest general teacher
    repo: lmstudio-community/Qwen3.6-35B-A3B-MLX-4bit
    local: /Volumes/SATECHI/.omlx/lmstudio-community/Qwen3.6-35B-A3B-MLX-4bit
    domains: [knowledge, reasoning, truthfulness, abstention]
    # Half of all traces are dropped for exceeding the 1024-token training cap,
    # so the teacher is asked to keep reasoning short. Rejection sampling still
    # catches any answer that gets worse for it.
    style: "Keep your reasoning under 150 words, then give the final answer."
    style_by_domain:
      # Deciding a passage does not contain an answer needs a look, not an
      # essay: unshortened, these traces ran ~1300 tokens and 84% of them
      # exceeded the training cap, leaving too few to teach the behaviour.
      abstention: "Check the passage briefly. In two or three sentences, say whether it contains the answer, then give the final line."
    max_tokens: 2048
    temp: 0.6
    top_p: 0.95
  code:            # matches Qwen on HumanEval at ~4.6x the throughput
    repo: ornith-ai/Ornith-1.5-35B-A3B-MLX-4bit
    local: /Volumes/SATECHI/.omlx/ornith-ai/Ornith-1.5-35B-A3B-MLX-4bit
    domains: [code, agentic, tools]
    # No brevity instruction, deliberately. v2 added one to fit the length cap
    # and HumanEval fell 90.8% -> 85.4%, below even the stock model: shorter
    # teacher reasoning taught the student to think less about code, and code
    # is where reasoning pays. v3 raises the cap instead. See DECISIONS.md 29.
    max_tokens: 2048
    temp: 0.4
    top_p: 0.95

# Weights live on the external volume /Volumes/SATECHI/.omlx (the oMLX model dir
# from ~/.omlx/settings.json). It must be mounted; `odistil check` verifies this.
# Verified 2026-09-04: student and both teachers share an identical 248044-token
# vocabulary (same token->id map), so top-k logit distillation is viable (v2).
